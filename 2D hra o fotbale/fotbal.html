<!DOCTYPE html>

<meta charset="utf-8">

<title>Fotbal 4 na 4</title>
<style>
:root{--bg:#cfd6dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c}}
:root[data-theme="dark"]{--bg:#14181c}

</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
// rozměry (logické jednotky 1280x720, plátno se škáluje na celou obrazovku)
const W=1280,H=720,FX0=100,FX1=1180,FY0=155,FY1=680,FW=FX1-FX0,FH=FY1-FY0,CX=640,CY=(FY0+FY1)/2;
const PR=6.75,BR=6.67,SPD=115,KSPD=75,SHOTV=1.5,KUP=.4,MOVACC=.6,PPOST=.6,POPP=.75,PASST=1.6,BLK=24,FR=1.3,REACH=14,LR=34; // hráč, míč, rychlost hráče/brankáře, tření míče, dosah kopu, poloměr dopadu lobu
const AUTO_SWITCH=true;                                   // ovládání se přepne na hráče, který získá míč
const BREAK=15,HALF=[45,45,15,15],BASE=[0,45,90,105];     // herní minuty
const GSC=[1,.88,.78,.7,.6,.52];   // velikost bran podle délky zápasu (čím delší zápas, tím menší brány)
const SPMS=[4/3,10/3,20/3,40/3,30,60];                    // reálné sekundy na 1 herní minutu
const OPT=['1 s = 0,75 min   (zápas 2 min)','3⅓ s = 1 min   (zápas 5 min)','6⅔ s = 1 min   (zápas 10 min)','13⅓ s = 1 min   (zápas 20 min)','30 s = 1 min   (zápas 45 min)','1 min = 1 min   (zápas 90 min)'];
const LAB=['1. poločas','2. poločas','Prodloužení – 1. část','Prodloužení – 2. část'];
let GD,GM,GB,gBase=1;const setGoal=k=>{GD=66*k*gBase;GM=72*k*gBase;GB=96*k*gBase};setGoal(1);
const T=[{name:'Tým 1',col:'#ff8a1f'},{name:'Tým 2',col:'#a24ba3'}];
const KS=[ // [0] levá část klávesnice, [1] pravá část (klávesy podle fyzické pozice)
{mv:['KeyI','KeyK','KeyJ','KeyL'],prev:'KeyQ',next:'KeyE',pass:['Digit1','Digit2','Digit3','Digit4'],shoot:'Space',lob:['Tab'],pause:'Escape'},
{mv:['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],prev:'Numpad5',next:'Numpad6',pass:['Numpad1','Numpad2','Numpad3','Numpad4'],shoot:'Numpad0',lob:['Enter','NumpadEnter'],pause:'Pause'}];
const FORM=[[.2,.5],[.25,.25],[.25,.75],[.395,.5]];      // hráč 1 = brankář
const P=[],act=[3,3],kLock=[false,false],isAI=[false,false],atkT=[0,0],S=[0,0],K={},B={x:CX,y:CY,vx:0,vy:0,own:null,air:null,last:0};
for(let t=0;t<2;t++)FORM.forEach((f,n)=>P.push({t,n,x:0,y:0,vx:0,vy:0,r:n?PR:11,on:true,cd:0,ax:1,ay:0,hold:0}));
let state='mode',sel=1,setupT=0,rs=null,mode=1,hTeam=0,swapOpt=true,swapOn=true,over=false,lastP=null,kk=0,mustPass=null,SPM=10/3,phase=0,gmin=0,brk=0,swapped=false,et=false,gt=0,scorer=0,duelT=0,msg='',spr=null,pen=null;
const sd=t=>swapped?1-t:t,pl=(t,n)=>P[t*4+n],cur=t=>isAI[t]?null:pl(t,act[t]),dirOf=t=>sd(t)?-1:1;
const IN=[[0,0,0,0],[0,0,0,0]],STC=['play','pause','goal','out','break','pen','end'];   // IN[tým] = [nahoru,dolů,doleva,doprava]
const net={role:'',room:undefined,gr:null,code:'',me:'',slot:['',''],want:[0,0],order:[],seen:{},seq:0,Q:[],lastQ:-1,lastPub:0,lastIn:'',q:[],qs:0,miss:0,err:'',cfg:{sel:1,swp:1}}; // sd: tým↔strana hřiště

function reset(kt=kk){
 for(const p of P){const f=FORM[p.n],s=sd(p.t);p.x=FX0+(s?1-f[0]:f[0])*FW;p.y=FY0+(s?1-f[1]:f[1])*FH;p.vx=p.vy=0;p.cd=0;p.ax=s?-1:1;p.ay=0}
 B.x=CX;B.y=CY;B.vx=B.vy=0;B.own=null;B.air=null;duelT=0;setupT=0;rs=null;over=false;mustPass=null;atkT[0]=atkT[1]=0;for(let t=0;t<2;t++)act[t]=kLock[t]?0:et?1:3;kickoff(kt)}
function kickoff(kt){   // rozehrávka ze středu: kt = tým, který rozehrává
 const d=dirOf(kt),s=sd(kt),fp=[3,1,2].map(n=>pl(kt,n)).filter(p=>p.on),tk=fp[0];
 tk.x=CX-d*(tk.r+BR-1);tk.y=CY;   // hráč 4 na středu s míčem
 fp.slice(1).forEach(p=>{p.x=CX-d*70;p.y=CY+(p.n===1?-1:1)*(s?-1:1)*FH/4});   // hráči 2 a 3 kousek za ním v polovině úsečky střed – autóvá čára
 tk.hold=0;mustPass=tk;B.own=tk;B.last=kt;B.x=CX;B.y=CY;act[kt]=kLock[kt]?0:tk.n;duelT=1.5;rs={p:tk,x:tk.x,y:tk.y,t:4}}
reset();

// ---------- míč: držení, kopy ----------
function capture(p){rs=null;B.tgt=null;lastP=null;mustPass=null;const mine=B.last===p.t;B.own=p;B.last=p.t;B.vx=B.vy=0;B.air=null;p.hold=p.n?0:1;if(AUTO_SWITCH&&!kLock[p.t]&&(p.n||mine))act[p.t]=p.n}
function blockLob(p,ux,uy){   // lob těsně před protivníkem se nepovede: 50 % míč u blokuícího, 50 % náhodný odraz
 let b=null,bd=1e9;
 for(const q of P){if(!q.on||q.t===p.t)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
  if(d>0&&d<p.r+q.r+14&&(dx*ux+dy*uy)/d>.5&&d<bd){bd=d;b=q}}
 if(!b)return false;
 if(Math.random()<.5)capture(b);
 else{const a=Math.random()*6.283;B.vx=Math.cos(a)*320;B.vy=Math.sin(a)*320;b.cd=.4}
 return true}
function kick(p,tx,ty,end,lob,sm=1,ts=1){
 const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,s=p.r+BR+2;let v0=Math.min(1400*sm,(FR*d+end)*sm);if(ts>1){const tn=Math.log(v0/Math.max(50,v0-FR*d))/FR*ts;v0=FR*d/(1-Math.exp(-FR*tn))}
 B.own=null;rs=null;B.tgt=null;lastP=null;mustPass=null;B.last=p.t;p.cd=.4;B.x=p.x+ux*s;B.y=p.y+uy*s;
 if(lob&&blockLob(p,ux,uy)){}else if(lob){B.vx=B.vy=0;B.air={sx:B.x,sy:B.y,tx,ty,T:2*Math.log(v0/Math.max(50,v0-FR*d))/FR,t:0}}   // lob letí dvakrát déle než míč po zemi
 else{B.vx=ux*v0;B.vy=uy*v0}}
const canKick=p=>setupT<=0&&(B.own===p||(!B.own&&!B.air&&Math.hypot(B.x-p.x,B.y-p.y)<p.r+BR+REACH));
function predict(p,q,lob,ts){   // nahrávka: míří tam, kam přijímající doběhne, až míč dorazí
 const sp=q.n?AISPD:KSPD,gx=q.gx===undefined?q.x:q.gx,gy=q.gy===undefined?q.y:q.gy,rx=gx-q.x,ry=gy-q.y,rl=Math.hypot(rx,ry)||1;
 let tx=q.x,ty=q.y;
 for(let i=0;i<4;i++){const d=Math.hypot(tx-p.x,ty-p.y),v0=Math.min(1400,FR*d+300),tt=Math.log(v0/Math.max(50,v0-FR*d))/FR*(lob?2:1)*ts,mv=Math.min(rl,sp*tt);tx=q.x+rx/rl*mv;ty=q.y+ry/rl*mv}
 return[Math.max(FX0+15,Math.min(FX1-15,tx)),Math.max(FY0+15,Math.min(FY1-15,ty))]}
function passTo(p,q,lob){let[tx,ty]=predict(p,q,lob,PASST);if(mustPass===p)tx=sd(p.t)?Math.max(tx,CX+10):Math.min(tx,CX-10);kick(p,tx,ty,300,lob,1,PASST);B.tgt=lob?null:q;lastP={t:p.t,n:q.n,at:performance.now(),lob,q}}
function boost(){   // dvojité stisknutí čísla: přihrávka letí stejně rychle jako dřív
 const L=lastP;lastP=null;
 if(L.lob){if(B.air){B.air.T/=PASST;B.air.t/=PASST}return}
 const[tx,ty]=predict(B,L.q,false,1),dx=tx-B.x,dy=ty-B.y,d=Math.hypot(dx,dy);
 if(d>8){const v0=Math.min(1400,FR*d+300);B.vx=dx/d*v0;B.vy=dy/d*v0}}
function pass(t,n,lob){const p=cur(t),q=pl(t,n);if(p===q||!q.on||!canKick(p))return;passTo(p,q,lob)}
function shoot(t,lob){const p=cur(t);if(!canKick(p)||mustPass===p)return;
 const d=dirOf(t),gx=d>0?FX1:FX0;
 let ty=aimY(1-t,gx);                            // uprostřed větší šance
 if(Math.random()<1/3)ty=CY+(Math.random()<.5?-1:1)*(GB+20+Math.random()*90);  // třetina střel mimo bránu
 if(Math.hypot(p.vx,p.vy)>20&&Math.abs(ty-CY)>GB&&Math.random()<MOVACC)ty=aimY(1-t,gx);   // střelec v pohybu je přesnější
 if(lob){const dep=GD*(.5+Math.random()*.15);kick(p,gx-d*dep,ty,450,true,SHOTV);if(B.air)B.air.roll=[d*(FR*dep+260)*SHOTV,0]}else kick(p,gx,ty,450,false,SHOTV)}                                          // lob dopadne před bránu (půl hloubky sítě nebo o něco blíž) a dokutálí se přes čáru
function sw(t,d){let n=act[t];do n=(n+d+4)%4;while(!pl(t,n).on);act[t]=n}  // přepíná i na brankáře (1)
function wpick(c){let w=c.reduce((s,p)=>s+(p.n?1:3),0)*Math.random();for(const p of c){w-=p.n?1:3;if(w<0)return p}return c[0]}   // brankář má při dopadu míče třikrát větší šanci
function land(a){B.air=null;const c=P.filter(p=>p.on&&Math.hypot(p.x-B.x,p.y-B.y)<LR);
 if(c.length)capture(wpick(c));                              // rovnocenná šance všech na místě dopadu
 else if(a.roll){B.vx=a.roll[0];B.vy=a.roll[1]}else{B.vx=(a.tx-a.sx)/a.T*.25;B.vy=(a.ty-a.sy)/a.T*.25}}
function duel(o,q){const r=Math.random();duelT=.9;
 if(r<.4){const s=o.r+q.r+4,l=Math.hypot(o.ax,o.ay)||1;o.x=q.x+o.ax/l*s;o.y=q.y+o.ay/l*s}                                  // klička
 else if(r<.8){const dx=q.x-o.x,dy=q.y-o.y,l=Math.hypot(dx,dy)||1;o.cd=.9;capture(q);q.ax=dx/l;q.ay=dy/l}                   // obránce bere míč
 else{const a=Math.random()*6.283;B.own=null;B.vx=Math.cos(a)*320;B.vy=Math.sin(a)*320;o.cd=q.cd=.5}}                       // náhodný odraz
const AISPD=95,nearest=(t,x,y,ai)=>{let b=null,bd=1e9;for(const q of P)if(q.t===t&&q.on&&q.n&&!(ai&&cur(t)===q)){const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;b=q}}return b};
function aiPlayer(p,dt){                       // AI hráče, kterého zrovna neovládá člověk: brání a nabíhá
 const t=p.t,rk=risk(t),d=dirOf(t),s=sd(t),f=FORM[p.n],o=B.own,hx=FX0+(s?1-f[0]:f[0])*FW,hy=FY0+(s?1-f[1]:f[1])*FH,
  bx=B.air?B.air.tx:B.x,by=B.air?B.air.ty:B.y;
 let tx=hx,ty=hy,chase=false;
 if(!o){if(nearest(t,bx,by)===p){tx=bx;ty=by;chase=true}else{tx=hx+(bx-hx)*.25;ty=hy+(by-hy)*.25}}   // volný/vzdušný míč: jde pro něj nejbližší
 else if(o===p){p.hold+=setupT>0?0:dt;const gx=d>0?FX1:FX0,gd=Math.abs(gx-p.x);   // AI hráč s míčem: střílí, nahrává, vede míč k bráně
  let od=1e9;for(const e of P)if(e.on&&e.t!==t)od=Math.min(od,Math.hypot(e.x-p.x,e.y-p.y));
  if(p.hold>.5&&gd<320+200*rk&&mustPass!==p&&Math.random()<dt*(2+3*rk)){aiShoot(p);return}
  if(p.hold>.5&&(od<70||mustPass===p)){let q=null,qo=0;for(const e of P)if(e.on&&e.t===t&&e!==p&&e.n){let m=1e9;for(const f2 of P)if(f2.on&&f2.t!==t)m=Math.min(m,Math.hypot(f2.x-e.x,f2.y-e.y));if(m>qo){qo=m;q=e}}
   if(q){passTo(p,q,false);return}}
  tx=setupT>0||mustPass===p?p.x:gx-d*150;ty=setupT>0||mustPass===p?p.y:CY+(p.y-CY)*.6;chase=true}
 else if(o.t===t){tx=d>0?Math.max(hx+FW*(.34+.12*rk),o.x+90+50*rk):Math.min(hx-FW*(.34+.12*rk),o.x-90-50*rk);ty=hy+(CY-hy)*.35+(o.y-hy)*.2;                                                    // náš míč: nabíhá dopředu a hledá volné místo
  let od=1e9,oq=null;for(const e of P)if(e.on&&e.t!==t){const k=Math.hypot(e.x-tx,e.y-ty);if(k<od){od=k;oq=e}}
  if(oq&&od<90){tx+=(tx-oq.x)/(od||1)*(90-od);ty+=(ty-oq.y)/(od||1)*(90-od)}}
 else if(o.n&&setupT<=0&&dirOf(o.t)*(o.x-CX)>0&&nearest(t,o.x,o.y)===p){const gx=d>0?FX0:FX1,vx=gx-o.x,vy=CY-o.y,vl=Math.hypot(vx,vy)||1;tx=o.x+vx/vl*BLK;ty=o.y+vy/vl*BLK;chase=true}   // nosič na útočné polovině: jeden obránce mu chodí těsně před ním a blokuje střely
 else if(o.n&&setupT<=0&&nearest(t,o.x,o.y)===p){tx=o.x;ty=o.y;chase=true}                                        // soupeřův míč: nejbližší napadá nosiče
 else{const gx=d>0?FX0:FX1;tx=gx+(o.x-gx)*(.45+.35*rk);ty=CY+(o.y-CY)*.5+(p.n-2)*60}                     // ostatní zavírají prostor před brankou
 if(!chase)tx=Math.max(FX0+GD+30,Math.min(FX1-GD-30,tx));
 p.gx=tx;p.gy=ty;const dx=tx-p.x,dy=ty-p.y,l=Math.hypot(dx,dy),m=Math.min(1,l/12);
 p.vx=l?dx/l*AISPD*m*(B.own===p?.8:1):0;p.vy=l?dy/l*AISPD*m*(B.own===p?.8:1):0;if(l>6){p.ax=dx/l;p.ay=dy/l}}
function risk(t){   // čím víc tým prohrává a čím méně zbývá času, tím víc riskuje (0 až 1)
 const df=S[1-t]-S[t];if(df<=0)return 0;
 const tot=phase>=2?120:90,el=BASE[phase]+gmin;
 return Math.min(1,df/2)*Math.max(0,Math.min(1,(el/tot-.25)/.75))}
function aimY(df,gx){   // kam míří střela: podle polohy brankáře soupeře
 const kp=pl(df,0),w=GB-12,ky=kp.y-CY,kn=Math.min(1,Math.abs(ky)/(GB*.7)),sg=ky<0?-1:1,r=Math.random;
 let y=(r()+r()-1)*w;   // základ: náhodně, uprostřed větší šance
 if(kp.on&&Math.abs(kp.x-gx)<160){
  if(r()<PPOST*(1-kn))y=(r()<.5?-1:1)*w*(.6+.4*r());   // brankář uprostřed: častěji k tyči
  else if(r()<POPP*kn)y=-sg*w*(.3+.7*r())}             // brankář na kraji: spíš na druhou stranu
 return CY+y}
function aiShoot(p){const d=dirOf(p.t),gx=d>0?FX1:FX0;let ty=aimY(1-p.t,gx);
 if(Math.random()<1/3)ty=CY+(Math.random()<.5?-1:1)*(GB+20+Math.random()*90);if(Math.hypot(p.vx,p.vy)>20&&Math.abs(ty-CY)>GB&&Math.random()<MOVACC)ty=aimY(1-p.t,gx);kick(p,gx,ty,450,false,SHOTV)}
function aiKeeper(p,dt){
 if(B.own===p){p.vx=p.vy=0;p.ax=dirOf(p.t);p.ay=0;p.hold-=dt;
  if(p.hold<=0){const c=P.filter(q=>q.t===p.t&&q.n&&q.on),q=c[Math.random()*c.length|0];passTo(p,q,false)}return}
 const d=dirOf(p.t),lx=d>0?FX0+45:FX1-45;
 const gx=d>0?FX0:FX1,gdx=B.x-gx,gdy=B.y-CY,gl=Math.hypot(gdx,gdy)||1,k=Math.min(gl,45+40*Math.max(0,1-gl/500));
 let tx=B.air?p.x:d>0?Math.max(gx+16,gx+gdx/gl*k):Math.min(gx-16,gx+gdx/gl*k),ty=B.air?p.y:CY+gdy/gl*k;
 const prog=Math.max(0,Math.min(1,d*(B.x-CX)/(FW/2)));
 if(prog>0){tx=gx+d*FW*(.12+(KUP+.1*risk(p.t)-.12)*prog);ty=CY+(B.y-CY)*.3;if(atkT[p.t]>=3-1.5*risk(p.t))tx=gx+d*FW*.46}   // míč na polovině soupeře: brankář se vysune a pomáhá útoku                          // brankář stojí na úsečce míč – střed brankové čáry
 if(!B.own&&!B.air&&(Math.abs(B.x-lx)<190||prog>0&&Math.hypot(B.x-p.x,B.y-p.y)<150)&&Math.hypot(B.vx,B.vy)<200){tx=B.x;ty=B.y} // pomalý míč před bránou si vyjde sebrat
 p.gx=tx;p.gy=ty;const dx=tx-p.x,dy=ty-p.y,l=Math.hypot(dx,dy),m=Math.min(1,l/8);
 const sp=KSPD*(prog<=0&&Math.abs(p.x-gx)>150?1.7:1);p.vx=l?dx/l*sp*m:0;p.vy=l?dy/l*sp*m:0}

// ---------- aut ----------
function restart(t,x,y,m){
 let b=null,bd=1e9;for(const p of P)if(p.t===t&&p.on&&p.n){const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}
 b.x=Math.max(FX0+PR,Math.min(FX1-PR,x));b.y=Math.max(FY0+PR,Math.min(FY1-PR,y));
 const dx=CX-b.x,dy=CY-b.y,l=Math.hypot(dx,dy)||1;b.ax=dx/l;b.ay=dy/l;
 B.own=b;B.air=null;B.vx=B.vy=0;B.last=t;b.cd=0;b.hold=0;if(!kLock[t])act[t]=b.n;duelT=m==='ROH'?6:1.2;setupT=m==='ROH'?5:0;rs={p:b,x:b.x,y:b.y,t:4};msg=m;state='out';gt=1}
function out(){
 const o=1-B.last;
 if(B.y<FY0-BR||B.y>FY1+BR)return restart(o,B.x,B.y<CY?FY0:FY1,'AUT');
 const s=B.x<CX?0:1,d=sd(s);                                                    // d = tým, který brání tuto stranu
 if(B.last===d)restart(1-d,s?FX1:FX0,B.y<CY?FY0:FY1,'ROH');
 else{const k=pl(d,0);capture(k);k.hold=1.2;rs={p:k,x:k.x,y:k.y,t:4};msg='VÝKOP';state='out';gt=1}}

// ---------- fyzika a pravidla ----------
function sub(dt,live){
 if(!live){if(!B.own&&!B.air){B.x+=B.vx*dt;B.y+=B.vy*dt;const f=Math.exp(-FR*dt);B.vx*=f;B.vy*=f;if(B.x<FX0-40){B.x=FX0-40;B.vx=0}else if(B.x>FX1+40){B.x=FX1+40;B.vx=0}}return}
 duelT-=dt;for(let t=0;t<2;t++){const ours=B.own?B.own.t===t:B.last===t;atkT[t]=ours&&dirOf(t)*(B.x-CX)>0?atkT[t]+dt:0}
 for(const p of P){if(!p.on)continue;p.cd=Math.max(0,p.cd-dt);
  if(cur(p.t)!==p&&p.n===0)aiKeeper(p,dt);
  else if(cur(p.t)!==p)aiPlayer(p,dt);
  else{let dx=0,dy=0;
   if(cur(p.t)===p&&!((setupT>0||mustPass===p)&&B.own===p)){const I=IN[p.t];dx=I[3]-I[2];dy=I[1]-I[0]}

// ---------- ovládání ----------
const codes=new Set(KS.flatMap(k=>[...k.mv,k.prev,k.next,...k.pass,k.shoot,...k.lob,k.pause]));
const isGo=c=>c==='Enter'||c==='NumpadEnter'||c==='Space';
addEventListener('keydown',e=>{
 const c=e.code;if(!codes.has(c))return;e.preventDefault();if(e.repeat)return;K[c]=1;
 if(state==='mode'){if(c==='ArrowUp')mode=mode<=1?3:mode-1;else if(c==='ArrowDown')mode=mode>=3?1:mode+1;else if(isGo(c)){if(mode===3)netOpen();else state='menu'}return}
 if(state==='net'){if(c==='Escape')state='mode';return}
 if(state==='lobby'){if(c==='Escape')netLeave();else if(c==='Digit1'||c==='Numpad1')setWant(0);else if(c==='Digit2'||c==='Numpad2')setWant(1);else if(isGo(c))netStart();return}
 if(net.role!=='client'){
  if(state==='setup'){if(c==='ArrowLeft')hTeam=0;else if(c==='ArrowRight')hTeam=1;else if(c==='ArrowUp'||c==='ArrowDown')swapOpt=!swapOpt;else if(isGo(c))startMatch();else if(c==='Escape')state='menu';return}
  if(state==='menu'){if(c==='ArrowUp')sel=(sel+5)%6;else if(c==='ArrowDown')sel=(sel+1)%6;else if(isGo(c))go();else if(c==='Escape')state='mode';return}
  if(state==='end'){if(isGo(c))endGo();return}
  if(state==='break'){if(isGo(c))nextPeriod();return}
  if(KS.some(k=>k.pause===c)&&(state==='play'||state==='pause')){state=state==='play'?'pause':'play';return}
 }
 if(state==='play'||state==='pen')keysAct(c)});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0;if(state==='play'&&mode!==3)state='pause'});
cv.addEventListener('pointerdown',e=>{window.focus();
 const r=cv.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H),x=(e.clientX-r.left-(r.width-W*s)/2)/s,y=(e.clientY-r.top-(r.height-H*s)/2)/s;
 for(const b of btns)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){b.fn();return}
  if(net.role==='client')return;
 if(state==='menu'){OPT.forEach((_,i)=>{const oy=145+i*54;if(x>340&&x<940&&y>oy&&y<oy+44){sel=i;go()}})}
 else if(state==='pause')state='play';else if(state==='break'){if(x>530&&x<750&&y>160&&y<190)nextPeriod()}else if(state==='end')endGo()});

(window.claude&&window.claude.use?window.claude.use('room'):Promise.resolve(null)).then(r=>{net.room=r||null}).catch(()=>{net.room=null});
let last=performance.now();
(function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
 if(net.role==='client'){clientTick();draw();requestAnimationFrame(loop);return}
 if(net.role==='host')hostPoll();
 syncIn();
 if(state==='play'){update(dt,true);if(state==='play'){gmin+=setupT>0?0:dt/SPM;setupT=Math.max(0,setupT-dt);if(gmin>=HALF[phase]){gmin=HALF[phase];over=true}}}
 else if(state==='goal'){update(dt,false);if((gt-=dt)<=0){if(over)endPeriod();else{reset(1-scorer);state='play'}}}
 else if(state==='out'){if((gt-=dt)<=0){if(over)endPeriod();else state='play'}}
 else if(state==='break'){brk+=dt/SPM;if(brk>=BREAK)nextPeriod()}
 else if(state==='pen')penTick(dt);
 if(net.role==='host')hostPub(t);
 draw();requestAnimationFrame(loop)})(last);
